<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="slider-container">
    <div class="slider">

        <div class="slide active">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80" alt="Mountain landscape">
            <div class="caption">
                <h2>Explore the Mountains</h2>
                <p>Find your next adventure.</p>
            </div>
        </div>

        <div class="slide">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1600&q=80" alt="Sunrise over a green field">
            <div class="caption">
                <h2>Chase the Sunrise</h2>
                <p>Every morning brings a new beginning.</p>
            </div>
        </div>

        <div class="slide">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80" alt="Beautiful tropical beach">
            <div class="caption">
                <h2>Escape to Paradise</h2>
                <p>Let the ocean calm your mind.</p>
            </div>
        </div>

        <div class="slide">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=80" alt="Lake surrounded by mountains">
            <div class="caption">
                <h2>Into the Wild</h2>
                <p>Discover the beauty of nature.</p>
            </div>
        </div>

    </div>

    <button class="nav-btn prev" aria-label="Previous slide">&#10094;</button>
    <button class="nav-btn next" aria-label="Next slide">&#10095;</button>

    <div class="dots"></div>
</div>

<script src="script.js"></script>
</body>
</html>
